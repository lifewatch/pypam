[project]
name = "lifewatch-pypam"
version = "1.0.0"
description = "Facilitate acoustic processing from underwater acoustic recorders"
authors = [{ name = "Clea Parcerisas", email = "cleap@vliz.be" }]
requires-python = ">=3.10, <3.13.0"
readme = "README.md"
license = "GPL-3.0-or-later"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "matplotlib>=3.7.1,<4",
    "pandas>=2.0.2,<3",
    "seaborn==0.13.0",
    "soundfile>=0.12.1,<0.13",
    "tqdm>=4.65.0,<5",
    "numba>=0.58",
    "noisereduce>=2.0.1,<3",
    "scikit-learn>=1.2.2,<2",
    "python-dateutil>=2.8.2,<3",
    "xarray==2023.8.0",
    "pyhydrophone>=0.4.0",
    "netcdf4>=1.6.4,<2",
    "syrupy>=4.0.4,<5",
    "scikit-maad>=1.4.3,<2",
    "openpyxl>=3.1.5,<4",
    "pvlib>=0.11.0,<0.12",
    "dask>=2023.0.0,<2024",
    "numpy<2.0",
]

[project.urls]
Repository = "https://github.com/lifewatch/pypam.git"

[dependency-groups]
dev = [
    "mypy>=1.15.0,<2",
    "ruff==0.2.2",
    "pre-commit>=3.3.1,<4",
    "isort>=5.12.0,<6",
    "black>=23.3,<27.0",
]
test = [
    "pyyaml>=6.0,<7",
    "pytest>=7.3.1,<8",
    "coverage>=7.2.5,<8",
    "python-dotenv>=1.0.0,<2",
    "pytest-cov>=4.1.0,<5",
]
docs = [
    "m2r>=0.2",
    "docutils>=0.20",
    "ipykernel>=6.29.5,<7",
    "numpydoc>=1.8.0,<2",
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.6.12,<10",
    "pandoc>=2.4,<3",
    "mkdocstrings[python]>=0.29.1,<0.30",
    "mkdocstrings-python>=1.16.10,<2",
    "mkdocs-gallery>=0.10.4,<0.11",
]

[tool.uv]

[tool.uv.build-backend]
module-name = ["pypam"]
module-root = ""

[build-system]
requires = ["uv_build>=0.10.1,<0.11.0"]
build-backend = "uv_build"

[tool.black]
line-length = 79

[tool.isort]
multi_line_output = 3
include_trailing_comma = true

[tool.pytest.ini_options]
testpaths = ["tests",]
pythonpath = ["."]
